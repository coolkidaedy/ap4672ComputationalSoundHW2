<!DOCTYPE html>
<html>
<style>
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;   /* vertical centering */
    align-items: center;       /* horizontal centering */
    height: 100vh;
    margin: 0;
    transition: background-color 200ms ease-in-out;
  }

  button {
    margin: 8px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 24px;
    justify-content: center;
    max-width: 640px;
    margin-top: 16px;
  }

  .control-group {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 140px;
  }

  .control-group label {
    font-size: 12px;
    font-weight: 600;
  }

  .control-group .value {
    font-size: 11px;
    color: #666;
  }

  input[type="range"] {
    width: 120px;
  }
</style>
<head>
    <meta charset="utf-8">
<title> Hello web audio </title>
</head>
<body>
  <button id="sineButton">Sine</button>
  <button id="additive">Additive synthesis (LFO added)</button>
  <button id="AM">AM synthesis</button>
  <button id="FM">FM synthesis</button>
  <p>Please select a synthesis method</p>

  <div class="controls">
    <div class="control-group">
      <label for="partials">Additive partials</label>
      <input type="range" id="partials" min="1" max="16" value="3">
      <span class="value" id="partialsValue">3</span>
    </div>
    <div class="control-group">
      <label for="modFreq">Modulation freq</label>
      <input type="range" id="modFreq" min="1" max="500" value="100">
      <span class="value" id="modFreqValue">100</span>
    </div>
    <div class="control-group">
      <label for="attack">Attack</label>
      <input type="range" id="attack" min="0" max="1" step="0.01" value="0.01">
      <span class="value" id="attackValue">0.01</span>
    </div>
    <div class="control-group">
      <label for="decay">Decay</label>
      <input type="range" id="decay" min="0" max="1" step="0.01" value="0.2">
      <span class="value" id="decayValue">0.2</span>
    </div>
    <div class="control-group">
      <label for="sustain">Sustain</label>
      <input type="range" id="sustain" min="0" max="1" step="0.01" value="0.5">
      <span class="value" id="sustainValue">0.5</span>
    </div>
    <div class="control-group">
      <label for="release">Release</label>
      <input type="range" id="release" min="0.01" max="2" step="0.01" value="0.3">
      <span class="value" id="releaseValue">0.3</span>
    </div>
  </div>
</body>
<script src="main.js"> </script>

</html >
